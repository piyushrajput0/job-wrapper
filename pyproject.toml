[project]
name = "jobwrapper"
version = "0.1.0"
description = "Autonomous job discovery + resume tailoring + application autofill. Aggregator edition (V1) and career-site plugin edition (V2)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Piyush Kumar Singh" }]
keywords = ["jobs", "ats", "resume", "automation", "playwright", "claude"]

dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "cryptography>=42.0",
    "platformdirs>=4.2",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "playwright>=1.45",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
jobwrapper = "jobwrapper.cli:main"
jw = "jobwrapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwrapper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["parity: cross-language resolver equivalence (needs a browser)"]
